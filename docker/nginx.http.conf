# HTTP-only reverse proxy, for reaching the app by its public IP before a
# domain and certificate exist.
#
# This serves the API and the frontend from one origin on port 80, so the
# security group only needs 80 open, and the refresh cookie stays same-site.
#
# It is fine for a demo. Put a domain and TLS in front of it (nginx.conf)
# before anyone signs in over an untrusted network - on plain HTTP the access
# token and the session cookie travel in clear text.

server {
    listen 80 default_server;
    server_name _;

    # Must exceed MAX_UPLOAD_SIZE_MB or uploads fail at the proxy with a 413.
    client_max_body_size 30M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
