services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-public_health_lms}
      POSTGRES_USER: ${POSTGRES_USER:-phlms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phlms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only - never expose a database on a public host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phlms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      # Loopback only - this Redis has no password set.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile -"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-phlms}:${POSTGRES_PASSWORD:-phlms}@db:5432/${POSTGRES_DB:-public_health_lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A config worker --loglevel=info
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-phlms}:${POSTGRES_PASSWORD:-phlms}@db:5432/${POSTGRES_DB:-public_health_lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me-in-production}
      DJANGO_DEBUG: "false"
    volumes:
      - media_data:/app/media
    depends_on:
      - backend

  beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A config beat --loglevel=info
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-phlms}:${POSTGRES_PASSWORD:-phlms}@db:5432/${POSTGRES_DB:-public_health_lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me-in-production}
      DJANGO_DEBUG: "false"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
