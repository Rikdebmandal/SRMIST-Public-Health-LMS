# HTTP-only overlay, for reaching the app by its public IP before a domain
# exists. Everything is served from port 80 through nginx.
#
#   docker compose -f docker-compose.yml -f docker-compose.http.yml up -d
#
# Swap to docker-compose.prod.yml once you have a domain and a certificate.

services:
  backend:
    ports: !override []
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      # No certificate yet, so forcing HTTPS would make the site unreachable.
      SECURE_SSL_REDIRECT: "false"

  frontend:
    ports: !override []
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  beat:
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
